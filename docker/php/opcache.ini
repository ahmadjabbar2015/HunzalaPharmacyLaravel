; Bytecode caching. The single largest performance difference between a default
; PHP image and a tuned one.

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

; Laravel plus vendor/ is well over the 10k default, and silently exceeding it
; means the excess is recompiled on every request.
opcache.max_accelerated_files = 20000

; The image is immutable - code cannot change without a new container - so
; never stat files looking for changes.
opcache.validate_timestamps = 0

; JIT is deliberately left off. It helps compute-bound code; this app is bound
; by MySQL round-trips, where JIT costs memory and returns nothing.
opcache.jit = disable
