; Production PHP settings for the pharmacy app.

; Never render a stack trace to a customer-facing screen. Laravel's own
; APP_DEBUG governs its error pages; this governs PHP's.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; A long sale or a year-end report is the heaviest thing this app does.
memory_limit = 256M
max_execution_time = 60

; CSV imports of a supplier price list are the only large uploads.
upload_max_filesize = 16M
post_max_size = 20M

; Timestamps are stored UTC-naive and converted for display only, so PHP must
; agree with the database. See app/Support/BusinessDate.php.
date.timezone = UTC

; Do not leak the PHP version in response headers.
expose_php = Off
