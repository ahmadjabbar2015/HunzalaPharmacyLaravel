[www]
; Log to the container's stdout so `docker compose logs` is the single place
; to look, rather than a file inside a dead container.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Sized for the 1 GB / 1 vCPU VPS in DEPLOYMENT_WEB.md §2. At ~40MB per PHP
; worker, 8 children is roughly 320MB - leaving room for MySQL, which needs
; far more than the app does.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recycle workers periodically so a slow leak in a long report cannot grow
; unbounded over weeks of uptime.
pm.max_requests = 500

; Answers the Dockerfile HEALTHCHECK.
ping.path = /ping
