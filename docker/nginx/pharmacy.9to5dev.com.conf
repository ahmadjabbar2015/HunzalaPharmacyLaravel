# Host-nginx vhost for pharmacy.9to5dev.com — used because this server already
# runs other apps (Munsif, dine-api, dine-app) whose host nginx owns ports
# 80/443, so the stack's own nginx is not the public entry point: it publishes
# to 127.0.0.1:8100 only and this proxies to it. Port 8100 matches the
# host-port binding in ../../docker-compose.override.yml.
#
# Mirrors api.dinedecider.pk.conf. The /app/* and /apps/* Reverb locations from
# that file are deliberately absent: this stack has no reverb container, so
# those would proxy to nothing — and /app/ as a prefix would shadow any real
# route under that path.
#
# Install:
#   sudo cp pharmacy.9to5dev.com.conf /etc/nginx/sites-available/pharmacy.9to5dev.com
#   sudo ln -s /etc/nginx/sites-available/pharmacy.9to5dev.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pharmacy.9to5dev.com
# certbot rewrites this file in place to add the 443/SSL block and the
# 80->443 redirect, same as it did for api.dinedecider.pk.

server {
    server_name pharmacy.9to5dev.com;

    client_max_body_size 350M;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A month-long report is the slowest request in the app; give it the
        # same headroom dine-api allows for its uploads.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
